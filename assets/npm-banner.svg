<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Afilimax — Encontre a oferta. Gere o link. Divulgue sozinho.">
  <defs>
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F86CAF"/>
      <stop offset="100%" stop-color="#7366FF"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F86CAF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#27272A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7366FF" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#F86CAF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="84%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#7366FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="316" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="320" fill="#0A0A0A"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#gridPattern)"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#glowLeft)"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#glowRight)"/>
  </g>

  <rect x="2" y="2" width="1196" height="316" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Official Afilimax Monogram Icon -->
  <g transform="translate(64 80)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#111114" stroke="#27272A" stroke-width="2"/>
    <g transform="translate(80 80) scale(0.25) translate(-256 -256)">
      <g fill="none" stroke="url(#wordmarkGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="176" cy="256" r="80"/>
        <path d="M256 176V336"/>
        <path d="M256 216A40 40 0 0 1 336 216V336M336 216A40 40 0 0 1 416 216V336"/>
      </g>
    </g>
  </g>

  <!-- Wordmark + Tagline + Store Pills -->
  <g transform="translate(260 96)">
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">
      <tspan fill="#FAFAFA">afili</tspan><tspan fill="url(#wordmarkGrad)">max</tspan>
    </text>

    <text x="2" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#D4D4D8" letter-spacing="-0.2">
      Encontre a oferta. Gere o link. Divulgue sozinho.
    </text>

    <g transform="translate(0 116)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="76" height="28" rx="14" fill="#16161B" stroke="#27272A" stroke-width="1"/>
      <text x="38" y="18.5" text-anchor="middle" fill="#E4E4E7">Amazon</text>

      <rect x="84" y="0" width="114" height="28" rx="14" fill="#16161B" stroke="#27272A" stroke-width="1"/>
      <text x="141" y="18.5" text-anchor="middle" fill="#E4E4E7">Mercado Livre</text>

      <rect x="206" y="0" width="72" height="28" rx="14" fill="#16161B" stroke="#27272A" stroke-width="1"/>
      <text x="242" y="18.5" text-anchor="middle" fill="#E4E4E7">Shopee</text>

      <rect x="286" y="0" width="90" height="28" rx="14" fill="#16161B" stroke="#27272A" stroke-width="1"/>
      <text x="331" y="18.5" text-anchor="middle" fill="#E4E4E7">AliExpress</text>

      <rect x="384" y="0" width="72" height="28" rx="14" fill="#16161B" stroke="#27272A" stroke-width="1"/>
      <text x="420" y="18.5" text-anchor="middle" fill="#E4E4E7">Magalu</text>

      <rect x="464" y="0" width="64" height="28" rx="14" fill="#16161B" stroke="#27272A" stroke-width="1"/>
      <text x="496" y="18.5" text-anchor="middle" fill="#E4E4E7">Shein</text>
    </g>
  </g>

  <!-- Right Side CTA Pill & Ecosystem Label -->
  <g transform="translate(920 108)">
    <rect x="0" y="0" width="216" height="44" rx="22" fill="#141418" stroke="url(#wordmarkGrad)" stroke-width="1.5"/>
    <text x="108" y="27.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAFAFA">
      afilimax.net &#x2192;
    </text>
    <text x="108" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#A1A1AA">
      Ecossistema Open Source
    </text>
    <text x="108" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#71717A">
      WhatsApp &#x2022; Telegram &#x2022; Discord
    </text>
  </g>
</svg>
